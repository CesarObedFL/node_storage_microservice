name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # JOB: CI - test
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@10.18.0 

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --prefer-frozen-lockfile --ignore-workspace

      - name: Run tests
        run: pnpm test

  # JOB: CD - deploy
  deploy:
    needs: test                     # Depends on test job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Step: Deploy via SSH
      # ----------------------------------------------------------
      # The following secrets must be set in the GitHub repository:
      #   - SSH_HOST        : IP or domain of the VPS
      #   - SSH_USER        : SSH username
      #   - SSH_PRIVATE_KEY : Private SSH key (with proper permissions)
      #   - SSH_PORT        : SSH port (optional, defaults to 22)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # 1. Go to the project directory
            cd /var/www/node_storage_microservice

            # 2.
            git checkout -- config/tokens.json 2>/dev/null || true

            # 3. Pull the latest changes
            git pull origin main

            # 4. Install dependencies (if any changed)
            pnpm install --frozen-lockfile

            # 5. Reload the application with PM2 (zero downtime)
            pm2 reload ecosystem.config.cjs --env production

            # 6. Reload the app into the PM2 processes
            pm2 reload node_storage_microservice

            # 7. Save PM2 process list (optional)
            pm2 save

            echo "✅ Deployment completed successfully!"