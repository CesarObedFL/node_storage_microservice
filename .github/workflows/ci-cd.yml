name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==============================================================
  # JOB: CI - test
  # ==============================================================
  # Runs the test suite using Vitest.
  # This job is executed for both push and pull_request events.
  # ==============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Step: Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Step: Setup Node.js
      # ----------------------------------------------------------
      # Uses Node.js 20 with pnpm caching for faster installs.
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ----------------------------------------------------------
      # Step: Install pnpm globally
      # ----------------------------------------------------------
      - name: Install pnpm
        run: npm install -g pnpm

      # ----------------------------------------------------------
      # Step: Install dependencies
      # ----------------------------------------------------------
      # Uses --frozen-lockfile to ensure the lockfile is up to date.
      # ----------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------
      # Step: Run tests
      # ----------------------------------------------------------
      # Executes the test script defined in package.json.
      # ----------------------------------------------------------
      - name: Run tests
        run: pnpm test

  # ==============================================================
  # JOB: CD - deploy
  # ==============================================================
  # Deploys the application to the production VPS using SSH.
  # This job runs only if:
  #   - The 'test' job succeeds.
  #   - The event is a push to the 'main' branch.
  # ==============================================================
  deploy:
    needs: test                     # Depends on test job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Step: Deploy via SSH
      # ----------------------------------------------------------
      # The following secrets must be set in the GitHub repository:
      #   - SSH_HOST        : IP or domain of the VPS
      #   - SSH_USER        : SSH username
      #   - SSH_PRIVATE_KEY : Private SSH key (with proper permissions)
      #   - SSH_PORT        : SSH port (optional, defaults to 22)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # 1. Go to the project directory
            cd /var/www/node_storage_microservice

            # 2. Pull the latest changes
            git pull -u origin main

            # 3. Install dependencies (if any changed)
            pnpm install --frozen-lockfile

            # 4. Reload the application with PM2 (zero downtime)
            pm2 reload ecosystem.config.cjs --env production

            # 5. Reload the app into the PM2 processes
            pm2 reload node_storage_microservice

            # 6. Save PM2 process list (optional)
            pm2 save

            echo "✅ Deployment completed successfully!"